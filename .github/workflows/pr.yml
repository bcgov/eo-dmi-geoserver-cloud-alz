name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true
permissions: {}

jobs:
  fork-gate:
    name: fork-gate
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Reject fork PRs
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error::PRs from forks do not run automatically. Re-land from an in-repo branch after review."
            exit 1
          fi

  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    needs: fork-gate
    permissions:
      attestations: write
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [node-oidc-proxy]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          # The PR tag is mutable (reused every push) and is what merge.yml
          # deploys/promotes; the head SHA tag is immutable and is what PR
          # deploys use, so each push changes the pod spec and forces a rollout.
          tags: |
            ${{ github.event.number }}
            ${{ github.event.pull_request.head.sha }}
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/', '.github/workflows/pr.yml')

  results:
    name: results
    if: always()
    needs: [fork-gate, builds]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "::error::A required job did not succeed (${result})."
              exit 1
            fi
          done
