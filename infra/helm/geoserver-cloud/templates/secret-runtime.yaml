{{- $runtime := .Values.secrets.runtime }}
{{- $runtimeSecretName := include "geoserver-cloud.runtimeSecretName" . }}
{{- $rabbitmqPassword := include "geoserver-cloud.runtimeSecretValue" (dict "root" . "key" $runtime.keys.rabbitmqPassword "fallback" (randAlphaNum 32)) -}}
{{- $geoserverAdminPassword := include "geoserver-cloud.runtimeSecretValue" (dict "root" . "key" $runtime.keys.geoserverAdminPassword "fallback" (randAlphaNum 32)) -}}
{{- $aclAdminPassword := trimPrefix "{noop}" (include "geoserver-cloud.runtimeSecretValue" (dict "root" . "key" $runtime.keys.aclAdminPassword "fallback" (randAlphaNum 32))) -}}
{{- $aclGeoserverPassword := include "geoserver-cloud.runtimeSecretValue" (dict "root" . "key" $runtime.keys.aclGeoserverPasswordPlain "fallback" (randAlphaNum 32)) -}}
{{- $oidcFallback := default (randAlphaNum 48) $runtime.oidcClientSecret -}}
{{- $oidcClientSecret := include "geoserver-cloud.runtimeSecretValue" (dict "root" . "key" $runtime.keys.oidcClientSecret "fallback" $oidcFallback) -}}
{{- $sessionCookieSecret := include "geoserver-cloud.runtimeSecretValue" (dict "root" . "key" $runtime.keys.sessionCookieSecret "fallback" (randAlphaNum 48)) -}}
{{- $rabbitmqErlangCookie := include "geoserver-cloud.runtimeSecretValue" (dict "root" . "key" $runtime.keys.rabbitmqErlangCookie "fallback" (randAlphaNum 32)) -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $runtimeSecretName }}
  labels:
    {{- include "geoserver-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-secret
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $runtime.keys.rabbitmqUsername }}: geoserver
  {{ $runtime.keys.rabbitmqPassword }}: {{ $rabbitmqPassword | quote }}
  {{ $runtime.keys.geoserverAdminUsername }}: admin
  {{ $runtime.keys.geoserverAdminPassword }}: {{ $geoserverAdminPassword | quote }}
  {{ $runtime.keys.aclAdminPassword }}: {{ printf "{noop}%s" $aclAdminPassword | quote }}
  {{ $runtime.keys.aclGeoserverPassword }}: {{ printf "{noop}%s" $aclGeoserverPassword | quote }}
  {{ $runtime.keys.aclGeoserverPasswordPlain }}: {{ $aclGeoserverPassword | quote }}
  {{ $runtime.keys.oidcClientSecret }}: {{ $oidcClientSecret | quote }}
  {{ $runtime.keys.sessionCookieSecret }}: {{ $sessionCookieSecret | quote }}
  {{ $runtime.keys.rabbitmqErlangCookie }}: {{ $rabbitmqErlangCookie | quote }}
